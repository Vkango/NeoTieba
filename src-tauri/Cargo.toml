[package]
name = "neotieba"
version = "0.1.0"
description = "A third party Baidu TieBa client"
authors = ["Vkango"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "neotieba_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/tieba-api"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tieba-api = { path = "crates/tieba-api" }
tauri = { version = "2", features = ["protocol-asset", "devtools", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-decorum = "1.1.1"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
prost = "0.13.5"
reqwest = { version = "0.12", features = ["json", "multipart"] }
window-vibrancy = "0.5.2"
tokio = { version = "1", features = ["full"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
url = "2.5"
http = "1.0"
base64 = "0.22"
tauri-plugin-clipboard-x = "2.0.1"
tar = "0.4"
memmap2 = "0.9"
sha1 = "0.10"
font-kit = "0.14"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
